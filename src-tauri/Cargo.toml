[package]
name = "keym"
version = "0.1.0"
description = "KeyM - 本地 API 密钥管理"
authors = ["you"]
edition = "2021"

[lib]
name = "keym_lib"
# 桌面端不需要 cdylib；windows-gnu 链接 cdylib 会触发 export ordinal too large
crate-type = ["staticlib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-opener = "2"
tauri-plugin-dialog = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
rusqlite = { version = "0.32", features = ["bundled"] }
argon2 = "0.5"
aes-gcm = "0.10"
rand = "0.8"
base64 = "0.22"
chrono = { version = "0.4", features = ["serde"] }
reqwest = { version = "0.12", features = ["json", "rustls-tls"], default-features = false }
tokio = { version = "1", features = ["full"] }
thiserror = "1"
zeroize = "1"

# 发布构建：关闭 LTO、提高并行度以控制构建时长；strip 减小体积
[profile.release]
codegen-units = 16
lto = false
opt-level = 2
panic = "abort"
strip = true
